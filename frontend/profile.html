<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container">
            <img src="assets/logo.svg" alt="SkillExchange Logo" class="logo">
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="how-it-works.html">Как это работает</a>
                <a href="login.html">Войти</a>
                <button class="register-btn" onclick="location.href='register.html';">Регистрация</button>
            </nav>
        </div>
    </header>
    
    <!-- Основной контент -->
    <div class="profile-container">
        <h1>Профиль пользователя</h1>
        <div class="profile-info">
            <p><span>Имя:</span> Jane Smith</p>
            <p><span>Email:</span> janesmith@example.com</p>
            <p><span>Навыки:</span> не указаны</p>
            <p><span>Интересы:</span> не указаны</p>
        </div>
        <form class="edit-form">
            <label for="skills">Навыки:</label>
            <input type="text" id="skills" name="skills" placeholder="Введите навыки">
            
            <label for="interests">Интересы:</label>
            <input type="text" id="interests" name="interests" placeholder="Введите интересы">
            
            <button type="submit">Сохранить изменения</button>
        </form>
    </div>
    
    <footer>
        <p>© 2025, Платформа обмена навыками</p>
    </footer>

    <!-- Подключение JS файлов -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
