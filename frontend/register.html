<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <img src="assets/logo.svg" alt="SkillExchange Logo" class="logo">
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="how-it-works.html">Как это работает</a>
                <a href="login.html">Войти</a>
                <button class="register-btn" onclick="location.href='register.html';">Регистрация</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="login-container">
            <h1>Регистрация</h1>
            <form class="register-form">
                <div class="form-group">
                    <label for="name">Имя:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2025, Платформа обмена навыками</p>
    </footer>
    <!-- Подключение JS файлов -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
