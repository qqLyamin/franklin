[package]
name = "franklin"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "entity", "migration"]

[dependencies.entity]
path = "entity"

[dependencies]
actix-web = "4"
dotenvy = "0.15.7"
sea-orm = { version = "1.1.5", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
