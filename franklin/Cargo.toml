[package]
name = "franklin"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
actix-cors = "0.7.0"
actix-web = "4"
argon2 = "0.5.3"
dotenvy = "0.15.7"
hmac = "0.12.1"
jwt = "0.16.0"
sea-orm = { version = "1.1.5", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.217", features = ["derive"] }
sha2 = "0.10.8"
uuid = { version = "1.13.1", features = ["v4", "fast-rng", "macro-diagnostics"] }
